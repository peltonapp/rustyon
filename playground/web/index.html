<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustyon playground</title>
<meta name="description" content="Format, validate and convert RON in your browser with rustyon compiled to WebAssembly.">
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf8;
  --panel: #ffffff;
  --text: #1d1f21;
  --muted: #666b72;
  --border: #d9d9d4;
  --rust: #ce422b;
  --blue: #007fa3;
  --err-bg: #fdecea;
  --err-text: #9b2615;
  --ok-text: #1a7f45;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --panel: #1b1e23;
    --text: #e6e6e3;
    --muted: #9aa0a8;
    --border: #2f343b;
    --rust: #e8613f;
    --blue: #3cc4ea;
    --err-bg: #3a1c18;
    --err-text: #ff9a8a;
    --ok-text: #5fd48c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { width: 200px; max-width: 60%; height: auto; display: block; }
.links { display: flex; gap: 16px; font-size: 14px; }
a { color: var(--blue); }
p.lead { color: var(--muted); margin: 12px 0 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 16px; }
.modes { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
.modes button {
  font: inherit; font-size: 14px; color: var(--text); background: transparent;
  border: 0; border-right: 1px solid var(--border); padding: 8px 14px; cursor: pointer;
}
.modes button:last-child { border-right: 0; }
.modes button[aria-pressed="true"] { background: var(--rust); color: #fff; }
.modes button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
label.opt { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
select {
  font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
}
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
.pane { display: flex; flex-direction: column; min-width: 0; }
.pane h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
textarea, pre#output {
  font: 14px/1.5 var(--mono);
  width: 100%; min-height: 360px; margin: 0; padding: 12px;
  color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px;
  tab-size: 4;
}
textarea { resize: vertical; white-space: pre; overflow: auto; }
pre#output { overflow: auto; white-space: pre; flex: 1; }
#status { margin-top: 16px; min-height: 24px; font-size: 14px; }
#status.error { background: var(--err-bg); color: var(--err-text); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); }
#status.ok { color: var(--ok-text); }
#status.info { color: var(--muted); }
#status button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
</style>

  <p class="lead">Format, validate and convert RON in your browser. Everything runs locally as WebAssembly, nothing is sent to a server.</p>

  <div class="controls">
    <div class="modes" role="group" aria-label="Mode" id="modes">
      <button type="button" data-mode="format" aria-pressed="true">Format</button>
      <button type="button" data-mode="validate" aria-pressed="false">Validate</button>
      <button type="button" data-mode="tojson" aria-pressed="false">RON to JSON</button>
      <button type="button" data-mode="fromjson" aria-pressed="false">JSON to RON</button>
    </div>
    <label class="opt" id="indent-label">Indent
      <select id="indent">
        <option value="  ">2 spaces</option>
        <option value="    " selected>4 spaces</option>
        <option value="&#9;">Tab</option>
        <option value="">Compact</option>
      </select>
    </label>
  </div>

  <div class="panes">
    <section class="pane">
      <h2 id="in-title">RON input</h2>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Input"></textarea>
    </section>
    <section class="pane">
      <h2>Output</h2>
      <pre id="output" aria-live="polite"></pre>
    </section>
  </div>

  <div id="status" class="info" role="status">Loading WebAssembly...</div>

  <footer>Powered by <a href="https://github.com/peltonapp/rustyon-go">rustyon-go</a>, an independent Go implementation of Rusty Object Notation.</footer>
</main>

<script src="wasm_exec.js"></script>
<script>
(function () {
  "use strict";

  var SAMPLE_RON = [
    "// A small game config.",
    "#![enable(implicit_some)]",
    "GameConfig(",
    "  window_size: (800, 600),",
    "  window_title: \"Rusty Game\",",
    "  difficulty: Hard,",
    "  spawn: Circle(radius: 2.5),",
    "  key_bindings: {\"up\": Up, \"down\": Down},",
    "  tags: [\"fast\", \"fun\"],",
    ")",
    ""
  ].join("\n");

  var SAMPLE_JSON = JSON.stringify({
    name: "rustyon",
    version: 1,
    features: ["format", "validate", "convert"],
    limits: { depth: 128, strict: true },
    note: null
  }, null, 2) + "\n";

  var MODES = {
    format:   { fn: "rustyonFormat",   title: "RON input",  sample: SAMPLE_RON,  indent: true },
    validate: { fn: "rustyonValidate", title: "RON input",  sample: SAMPLE_RON,  indent: false },
    tojson:   { fn: "rustyonToJSON",   title: "RON input",  sample: SAMPLE_RON,  indent: true },
    fromjson: { fn: "rustyonFromJSON", title: "JSON input", sample: SAMPLE_JSON, indent: true }
  };

  var $ = function (id) { return document.getElementById(id); };
  var input = $("input"), output = $("output"), status = $("status"), indentSel = $("indent");
  var mode = "format";
  var ready = false;
  var texts = {};
  var timer = null;

  function setStatus(kind, text, loc) {
    status.className = kind;
    status.textContent = "";
    if (loc) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = loc.line + ":" + loc.column;
      b.title = "Jump to this position";
      b.addEventListener("click", function () { jump(loc.line, loc.column); });
      status.appendChild(b);
      status.appendChild(document.createTextNode("  " + text));
    } else {
      status.textContent = text;
    }
  }

  function jump(line, col) {
    var lines = input.value.split("\n"), pos = 0, i;
    for (i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
    pos += Math.max(0, col - 1);
    input.focus();
    input.setSelectionRange(pos, Math.min(pos + 1, input.value.length));
  }

  function run() {
    if (!ready) return;
    var m = MODES[mode];
    var r = window[m.fn](input.value, indentSel.value);
    if (r.ok) {
      output.textContent = r.output;
      setStatus("ok", mode === "validate" ? "Valid RON." : "Done.");
    } else {
      output.textContent = "";
      var msg = String(r.error).replace(/^rustyon: (syntax error at \d+:\d+: )?/, "");
      if (r.line > 0) setStatus("error", msg, { line: r.line, column: r.column });
      else setStatus("error", msg);
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(run, 120);
  }

  function setMode(next) {
    texts[mode] = input.value;
    mode = next;
    var m = MODES[mode];
    input.value = texts[mode] !== undefined ? texts[mode] : m.sample;
    $("in-title").textContent = m.title;
    $("indent-label").style.display = m.indent ? "" : "none";
    Array.prototype.forEach.call($("modes").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    });
    output.textContent = "";
    run();
  }

  $("modes").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) setMode(b.dataset.mode);
  });
  input.addEventListener("input", schedule);
  indentSel.addEventListener("change", run);
  input.value = SAMPLE_RON;

  if (!WebAssembly.instantiateStreaming) {
    WebAssembly.instantiateStreaming = function (resp, imports) {
      return resp.then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) { return WebAssembly.instantiate(buf, imports); });
    };
  }
  var go = new Go();
  WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(function (res) {
    go.run(res.instance);
    ready = true;
    run();
  }).catch(function (err) {
    setStatus("error", "Could not load WebAssembly: " + err);
  });
})();
</script>
