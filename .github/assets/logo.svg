<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 255" role="img">
  <title>rustyon logo</title>
  <defs>
    <!-- hard split for the colon: blue top dot, rust bottom dot -->
    <linearGradient id="colon-split" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="255">
      <stop offset="0.537" style="stop-color: var(--go-blue)"/>
      <stop offset="0.537" style="stop-color: var(--rust)"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;display=swap');
    :root { --rust: #CE422B; --go-blue: #00ADD8; }
    .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    .symbol { font-size: 150px; text-anchor: middle; }
    .word { font-size: 64px; }
    .rust { fill: var(--rust); }
    .go { fill: var(--go-blue); }
    .colon { fill: url(#colon-split); }
  </style>
  <text class="mono symbol rust" x="145" y="178">(</text>
  <text class="mono symbol colon" x="215" y="178">:</text>
  <text class="mono symbol go" x="285" y="178">)</text>
  <text class="mono word" x="350" y="152"><tspan class="rust">rusty</tspan><tspan class="go">on</tspan></text>
</svg>
