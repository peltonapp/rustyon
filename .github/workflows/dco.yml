name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s'. See CONTRIBUTING.md."
          fi
          exit "$status"
