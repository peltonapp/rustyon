version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # The CLI is a separate module with its own dependencies.
  - package-ecosystem: gomod
    directory: /cmd/rustyon
    schedule:
      interval: weekly
