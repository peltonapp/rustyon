# Builds the rustyon CLI, which lives in its own Go module (cmd/rustyon).
#
# The CLI is released with tags named cmd/rustyon/vX.Y.Z. That is not a
# semantic version, and GoReleaser OSS has no monorepo tag prefix support, so
# the release workflow passes the version in GORELEASER_CURRENT_TAG, runs
# GoReleaser with --skip=publish and uploads dist/ with the gh CLI.
# See .github/workflows/release.yml and CONTRIBUTING.md.

version: 2

project_name: rustyon

builds:
  - id: rustyon
    dir: cmd/rustyon
    main: .
    binary: rustyon
    env:
      - CGO_ENABLED=0
      # Build against the library version in cmd/rustyon/go.mod, like
      # "go install" does, not against the local checkout from go.work.
      - GOWORK=off
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The release notes are generated by GitHub in the release workflow.
changelog:
  disable: true
